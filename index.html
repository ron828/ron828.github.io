,"colors":"BRYG"},{"rows":["YYRRYYRRYY","YBRBRRRRRY","BBBBBRGRGR","BBBBBGGGGG","RBBBRGGGGG","YRBRRRGGGY","YYRRRRRGYY","YYYYRRYYYY"],"target":"Y","moves":3,"colors":"BRYG"},{"rows":["YYYYYYYYYY","YRRRRRRRRY","YRGGGGGGRY","YRGBBBBGRY","YRGBBBBGRY","YRGGGGGGRY","YRRRRRRRRY","YYYYYYYYYY"],"target":"Y","moves":3,"colors":"BRYG"},{"rows":["YYRRGGGRRY","YRRGGBGGRR","RRGGBBBGGR","RGGBBGBBGG","RGBBGYGBBG","RGGBBGBBGG","RRGGBBBGGY","YRRGGBGGYY"],"target":"Y","moves":3,"colors":"BRYG"},{"rows":["YRRRRRRRRY","YYYRRRRRYY","BBYYYRRYYY","BBYYYRYYYB","BYYGYYYBBB","YYGGGYYYBB","YGGGGGYYYB","GGGGGGGYYB"],"target":"R","moves":3,"colors":"BRYG"},{"rows":["RRGGGGGGGR","RRYGGGGBGR","RGYBGGBBGR","RGYBBBBBGR","RGYYYYYBGR","RGYYGGYBGR","RGYGGGGBRR","RGGGGGGGRR"],"target":"G","moves":3,"colors":"BRYG"},{"rows":["RBBYGGYBBB","RRBYGGYBBR","RRRYGGYBRR","BRRRRRRRRR","BBRYGGYRRB","BBBYGGYRBB","BBYYGGYBBB","BYYYGGYBBB"],"target":"G","moves":3,"colors":"BRYG"},{"rows":["RRRBBBBRRR","GGRRBBRRGG","GGGGBBGGGG","YYYYBBYYYY","YYYYBBYYYY","RYBBBBBBYR","RRRBBBBBRR","RRRRBBRRRR"],"target":"R","moves":3,"colors":"BRYG"},{"rows":["YYYYYYYYYY","YYRRRRRRYY","BBGGGGGGBB","YYGRRRRGYY","YYGRRRRGYY","BBGGGGGGBB","YYRRRRRRYY","YYYYYYYYYY"],"target":"B","moves":3,"colors":"BRYG"},{"rows":["RRBBRRGGGR","BBBBRGGYGR","BBYBBBBBBB","RRGBRRGGRR","GGGBGGGGGR","RGGBGRGGYG","RRGBRRGGGG","RRBBBRRGGR"],"target":"R","moves":3,"colors":"BRYG"},{"rows":["BBBBBGGBRR","BYRRBYYBRR","BYRRBYYBGG","BBBBBBBBBB","GGRRBGGYRR","GGYYBRRYRR","RRYYBRRGGG","RRBBBBBGGG"],"target":"Y","moves":3,"colors":"BRYG"},{"rows":["YYYYYYYYYY","YRRRRRYBBY","YRBBBRYBBY","YRBYBRYYYY","YRBYBRYYYY","YRBBBRYBBY","YRRRRRYBBY","YYYYYYYYYY"],"target":"Y","moves":3,"colors":"BRY"},{"rows":["BYYYYYYYYY","YBYYRYRYRY","YYBYYYYRYY","YYYGYYRYRY","YYYYBYYYYY","YYYYYBYYRY","YYYYYYBYYY","YYYYYYYBYY"],"target":"B","moves":3,"colors":"BRYG"},{"rows":["YYYYYYYYYY","YBBBBBBBBY","YBRRRRRRBY","YBRYRYYRBY","YBRYYRYRBY","YBRRRRRRBY","YBBBBBBBBY","YYYYYYYYYY"],"target":"R","moves":3,"colors":"BRY"},{"rows":["BBRBBYBBRB","BBBGBBBGBB","BBBBRBRBBB","BBYBBBBBYB","BBBBRBRBBB","BBBGBBBGBB","BBRBBYBBRB","BRBBBBBBBR"],"target":"Y","moves":3,"colors":"BRYG"},{"rows":["BGGBBBYYRR","RBGGBBYYRR","RRBGGBYYGG","RRRGGGYYBB","BBYYYYYYRR","BBYGGBBBRR","BYYGBBBGGB","BYGGGGGGBB"],"target":"B","moves":3,"colors":"BRYG"},{"rows":["RRGYGYBBGR","RRRYRYBBGR","YYYYBYBYGR","RYBBBBBBGR","YYYBYBYBGR","YYBBYBYBGR","RGGBGBYBRR","RRRBYBYBRR"],"target":"G","moves":3,"colors":"BRYG"},{"rows":["RRYRRYRRBR","BBYBBYBBBB","RRYRRYRRBR","BBBBBYBBBB","RRYRRYRRBR","BBBBBBBBBB","RRYRRYRRBR","RRYRRYRRBR"],"target":"R","moves":4,"colors":"BRYG"},{"rows":["YYYYGGGGR#","RRRBBBBGR#","RYRYGYYGR#","R#R#G#YGR#","R#RYG#GGR#","R#RYY#YYY#","R#####BBYY","RRRBBBBBYY"],"target":"Y","moves":4,"colors":"BRYG"},{"rows":["GGBBBRBBBB","GYYYYYYYYB","BRBBBRBBYB","BRBBRRRRYR","YRYYYYBBYB","BRBBYBBBYB","BRRRRRRRRG","BBBBYBBBGG"],"target":"B","moves":4,"colors":"BRYG"},{"rows":["YGGGGGGGGR","YYYYBBBBGR","GBRYBBBBGR","GBRYYRBBGR","GBRRGYYBGR","GBRRRRYBGR","GBRRRRYYYY","GBBBBBBBBY"],"target":"R","moves":4,"colors":"BRYG"},{"rows":["YRBBYYYYYY","YRRYYYYYYY","YBYYBGGBBY","YBYYGYYYGY","YRYYBYYYGY","YGBBGYRRBY","YYYYYYRYYY","YYGGGRBYYY"],"target":"R","moves":4,"colors":"BRYG"},{"rows":["RRRRRBBBBB","GGGGGYYRRR","GBBBBGGGYY","GYGGGGYYYY","YYYYGGGGGG","YYGGGBBBBG","RRRYYGGGGG","BBBBBYYYYY"],"target":"B","moves":4,"colors":"BRYG"},{"rows":["YYRYRYYRYY","YBBBRBBBBY","YYRYRYYRYY","YYRYRYYRYY","YYRYRYYRYY","YBBBBBBRBY","YYRYRYYRYY","YYRYRYYRYY"],"target":"Y","moves":4,"colors":"BRY"},{"rows":["YYBBRRBBYY","BYYYRRYYYB","BYBRBBRBYB","RRRRYYRRYY","YYRRYYRRRR","BYBRBBRBYB","BYYYRRYYYB","YYBBRRBBYY"],"target":"B","moves":4,"colors":"BRY"},{"rows":["BGGGRBBGRR","BGRGRBBGRR","BGRGRBBGRR","BGGGRBBGRR","BGGGRBBGRR","BGRGRBBGRR","BGRGRBBGRR","BGGGRBBGRR"],"target":"R","moves":4,"colors":"BRG"},{"rows":["BYYRYYYRYY","YYGYYYGYYY","YRYYYRYYBY","RYYYRYYBYY","YYYRYYBYYR","YYRYYBYYGY","YRYYBYYRYY","YYYYYYGYYB"],"target":"B","moves":4,"colors":"BRYG"},{"rows":["YYYYYRRRRR","YYYYYRRRRR","YYBBBBBBRR","YYRRRYYYRR","BBRRRYYYBB","BBYYYRRRBB","BBYYYRRRBB","BBYYYRRRBB"],"target":"B","moves":4,"colors":"BRY"},{"rows":["RRBRRRGGGY","R####RBBBB","GGGGGGGG##","GGBB##RRR#","GGGGGGGGG#","GGGRRRBBRR","GBB#BR###R","YRRGRRBRBR"],"target":"Y","moves":5,"colors":"BRYG"},{"rows":["Y##GGGGBBY","YBBRRRRYBY","YBYGGGGBBY","YBBRRRRYYY","YYYGGGGBBY","YBBRRRRYBY","YBYGGGGBBY","YBBRRRR##Y"],"target":"Y","moves":5,"colors":"BRYG"},{"rows":["RRRR#RBRRR","RBBB#BBBBB","RBRRYYYYBR","RBRY##YY##","##YY##YRBB","BBYYYYRRBR","BBBBB#BBRR","BBBBB#BRRR"],"target":"Y","moves":5,"colors":"BRYG"},{"rows":["RBBBG#RBGR","RB#R#RR#B#","##RYYBYGRR","RB#YRBBGGR","YGGGG#BYYG","YRR#RRYGG#","GR##YY#BBR","YYY##G##RR"],"target":"R","moves":7,"colors":"BRYG"},{"rows":["BBRRBBRYYG","BYYGGGBGRG","RRBGRYGGRR","RBBYRYRBBR","RYGBBYRBYG","YGGRRGGBGR","BRYYGBRYYG","BGGYBBRYGG"],"target":"B","moves":8,"colors":"BRYG"}];
const NAMES={B:'כחול',R:'אדום',Y:'צהוב',G:'ירוק'};
const COLOR_CSS={B:'--blue',R:'--red',Y:'--yellow',G:'--green'};
const KEYS={B:'1',R:'2',Y:'3',G:'4'};
const TARGET_WORDS={B:'בכחול',R:'באדום',Y:'בצהוב',G:'בירוק'};
const WIDTH=10,STORAGE_KEY='color-puzzles-45-moves-v2';
let current=0,board=[],history=[],paint='B',focusIndex=0,completed=[],tiles=[],paletteButtons=[],savingWorks=true;
const el=id=>document.getElementById(id);
const boardEl=el('board'),selectEl=el('stage'),resultEl=el('result'),finishDialog=el('finish');
const announce=text=>{el('announcement').textContent=text;};
const initial=puzzle=>puzzle.rows.join('').split('');
const allowed=puzzle=>puzzle.colors.split('');
const won=(cells,target)=>cells.every(color=>color==='#'||color===target);
const isWon=()=>won(board,PUZZLES[current].target);
const isOver=()=>isWon()||history.length>=PUZZLES[current].moves;
function connected(cells,start){
  if(!Number.isInteger(start)||start<0||start>=cells.length||cells[start]==='#')return [];
  const color=cells[start],seen=new Set([start]),queue=[start];
  for(let p=0;p<queue.length;p++){
    const i=queue[p],col=i%WIDTH,neighbors=[i-WIDTH,i+WIDTH];
    if(col>0)neighbors.push(i-1);if(col<WIDTH-1)neighbors.push(i+1);
    for(const n of neighbors)if(n>=0&&n<cells.length&&cells[n]===color&&!seen.has(n)){seen.add(n);queue.push(n);}
  }
  return queue;
}
function replay(puzzle,actions){
  if(!Array.isArray(actions)||actions.length>puzzle.moves)return null;
  const cells=initial(puzzle),colors=allowed(puzzle);
  for(const action of actions){
    if(!Array.isArray(action)||action.length!==2||won(cells,puzzle.target))return null;
    const [i,color]=action;
    if(!Number.isInteger(i)||i<0||i>=cells.length||cells[i]==='#'||cells[i]===color||!colors.includes(color))return null;
    connected(cells,i).forEach(n=>{cells[n]=color;});
  }
  return cells;
}
function readProgress(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;
    const data=JSON.parse(raw);if(!data||data.version!==1||!Array.isArray(data.completed))return;
    for(let i=0;i<Math.min(data.completed.length,PUZZLES.length);i++){
      const verified=replay(PUZZLES[i],data.completed[i]);
      if(!verified||!won(verified,PUZZLES[i].target))break;
      completed.push(data.completed[i].map(action=>action.slice()));
    }
    if(Number.isInteger(data.current)&&data.current>=0&&data.current<PUZZLES.length&&data.current<=completed.length)current=data.current;
    else current=Math.min(completed.length,PUZZLES.length-1);
    if(replay(PUZZLES[current],data.history))history=data.history.map(action=>action.slice());
  }catch(error){if(error instanceof SyntaxError)return;savingWorks=false;}
}
function saveProgress(){
  if(!savingWorks)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,current,completed,history}));}
  catch{savingWorks=false;el('saving-warning').hidden=false;}
}
function clearHighlight(){tiles.forEach(tile=>tile.classList.remove('region'));}
function highlight(i){clearHighlight();if(!isOver())connected(board,i).forEach(n=>tiles[n].classList.add('region'));}
function setBoardFocus(i,focus){
  if(board[i]==='#')return;
  if(tiles[focusIndex])tiles[focusIndex].tabIndex=-1;
  focusIndex=i;tiles[i].tabIndex=0;if(focus)tiles[i].focus();
}
function moveFocus(i,key){
  let candidate=i;
  if(key==='Home'||key==='End'){
    const start=i-i%WIDTH;candidate=key==='Home'?start:start+WIDTH-1;
    const step=key==='Home'?1:-1;while(board[candidate]==='#'&&candidate>=start&&candidate<start+WIDTH)candidate+=step;
    if(candidate<start||candidate>=start+WIDTH)return;
  }else{
    const step={ArrowRight:1,ArrowLeft:-1,ArrowDown:WIDTH,ArrowUp:-WIDTH}[key];if(!step)return;
    do{candidate+=step;if(candidate<0||candidate>=board.length)return;if(Math.abs(step)===1&&Math.floor(candidate/WIDTH)!==Math.floor(i/WIDTH))return;}while(board[candidate]==='#');
  }
  setBoardFocus(candidate,true);
}
function selectColor(color,notify=true){
  if(!allowed(PUZZLES[current]).includes(color))return;
  paint=color;paletteButtons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.paint===color)));
  if(notify)announce(`נבחר צבע ${NAMES[color]}.`);
}
function buildBoard(){
  boardEl.replaceChildren();tiles=[];focusIndex=board.findIndex(color=>color!=='#');
  board.forEach((color,i)=>{
    const tile=document.createElement(color==='#'?'span':'button');tile.className=color==='#'?'tile blocked':'tile';
    if(color==='#'){tile.setAttribute('role','img');tile.setAttribute('aria-label',`משבצת חסומה, שורה ${Math.floor(i/WIDTH)+1}, עמודה ${i%WIDTH+1}`);}
    else{
      tile.type='button';tile.tabIndex=i===focusIndex?0:-1;
      tile.addEventListener('click',()=>{setBoardFocus(i,false);fill(i);});
      tile.addEventListener('pointerenter',()=>highlight(i));tile.addEventListener('pointerleave',clearHighlight);
      tile.addEventListener('focus',()=>highlight(i));tile.addEventListener('blur',clearHighlight);
      tile.addEventListener('animationend',()=>tile.classList.remove('changed'));
      tile.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key)){event.preventDefault();moveFocus(i,event.key);}});
    }
    boardEl.appendChild(tile);tiles.push(tile);
  });
  const palette=el('palette');palette.replaceChildren();const legend=document.createElement('legend');legend.textContent='בחרו צבע';palette.appendChild(legend);
  paletteButtons=allowed(PUZZLES[current]).map(color=>{
    const button=document.createElement('button');button.type='button';button.className='color';button.dataset.paint=color;
    button.setAttribute('aria-label',`${NAMES[color]}, מקש ${KEYS[color]}`);
    button.innerHTML=`<span class="swatch" style="--swatch:var(${COLOR_CSS[color]})"></span><span class="color-name">${NAMES[color]}</span><kbd>${KEYS[color]}</kbd>`;
    button.addEventListener('click',()=>{if(!isOver())selectColor(color);});palette.appendChild(button);return button;
  });
  palette.style.setProperty('--palette-count',paletteButtons.length);
  selectColor(allowed(PUZZLES[current])[0],false);
}
function render(){
  const puzzle=PUZZLES[current],remaining=puzzle.moves-history.length,over=isOver();
  tiles.forEach((tile,i)=>{if(board[i]==='#')return;tile.dataset.color=board[i];tile.setAttribute('aria-label',`שורה ${Math.floor(i/WIDTH)+1}, עמודה ${i%WIDTH+1}, ${NAMES[board[i]]}`);tile.setAttribute('aria-disabled',String(over));});
  el('goal-text').textContent=`צבעו את כל המשבצות ${TARGET_WORDS[puzzle.target]}`;el('goal').style.setProperty('--target',`var(${COLOR_CSS[puzzle.target]})`);
  el('remaining').textContent=remaining;el('move-dots').replaceChildren();
  for(let i=0;i<puzzle.moves;i++){const dot=document.createElement('i');if(i>=remaining)dot.className='used';el('move-dots').appendChild(dot);}
  boardEl.classList.toggle('is-won',isWon());boardEl.classList.toggle('is-over',over);paletteButtons.forEach(button=>{button.disabled=over;});
  selectEl.replaceChildren();PUZZLES.forEach((_,i)=>{const option=document.createElement('option');option.value=i;option.disabled=i>completed.length;option.textContent=`פאזל ${i+1} מתוך ${PUZZLES.length}${i<completed.length?' — הושלם':i>completed.length?' — נעול':''}`;selectEl.appendChild(option);});selectEl.value=String(current);
  el('next').hidden=current===PUZZLES.length-1;el('next').disabled=!isWon();
  el('progress').textContent=`הושלמו ${completed.length} מתוך ${PUZZLES.length} פאזלים`;
  el('saving-warning').hidden=savingWorks;
  if(isWon())resultEl.innerHTML=current===PUZZLES.length-1&&completed.length===PUZZLES.length?'<strong>כל הכבוד!</strong>השלמתם את כל 45 הפאזלים! 🎉':`<strong>הצלחתם!</strong>הפאזל הושלם ב־${history.length} מהלכים.`;
  else if(over)resultEl.innerHTML='<strong>נגמרו המהלכים</strong>התחילו מחדש ונסו שוב.';
  else resultEl.textContent='';
}
function showFinish(){if(completed.length===PUZZLES.length&&!finishDialog.open)finishDialog.showModal();}
function recordWin(){
  if(isWon()&&current===completed.length)completed.push(history.map(action=>action.slice()));
}
function fill(i){
  if(isOver()||!Number.isInteger(i)||i<0||i>=board.length||board[i]==='#')return;
  if(board[i]===paint){announce(`המשבצת כבר בצבע ${NAMES[paint]}. לא נוצל מהלך.`);return;}
  const region=connected(board,i);region.forEach(n=>{board[n]=paint;tiles[n].classList.remove('changed');});history.push([i,paint]);
  clearHighlight();recordWin();render();saveProgress();region.forEach(n=>tiles[n].classList.add('changed'));
  if(isWon()){if(current===PUZZLES.length-1)showFinish();else el('next').focus();}
  else if(!isOver())announce(`נצבעו ${region.length} משבצות בצבע ${NAMES[paint]}. מהלכים שנותרו: ${PUZZLES[current].moves-history.length}.`);
}
function loadLevel(index,actions=[]){
  if(!Number.isInteger(index)||index<0||index>=PUZZLES.length||index>completed.length){selectEl.value=String(current);return false;}
  current=index;const restored=replay(PUZZLES[current],actions);history=restored?actions.map(action=>action.slice()):[];board=restored||initial(PUZZLES[current]);
  buildBoard();recordWin();render();saveProgress();return true;
}
function reset(){loadLevel(current);announce(`פאזל ${current+1} התחיל מחדש. מהלכים שנותרו: ${PUZZLES[current].moves}.`);}
function nextLevel(){if(!isWon()||current>=PUZZLES.length-1)return;loadLevel(current+1);setBoardFocus(focusIndex,true);announce(`פאזל ${current+1} נפתח.`);}
selectEl.addEventListener('change',()=>{const index=Number(selectEl.value);if(loadLevel(index))announce(`פאזל ${current+1} נבחר.`);});
el('reset').addEventListener('click',reset);el('next').addEventListener('click',nextLevel);
el('finish-close').addEventListener('click',()=>finishDialog.close());
document.addEventListener('keydown',event=>{
  if(el('game-shell').hidden)return;
  if(finishDialog.open||event.ctrlKey||event.metaKey||event.altKey||event.repeat)return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)||event.target.isContentEditable)return;
  const color={'1':'B','2':'R','3':'Y','4':'G'}[event.key];if(color&&!isOver()){event.preventDefault();selectColor(color);}
  if(event.code==='KeyR'||event.key.toLowerCase()==='r'){event.preventDefault();reset();}
});
const introSlides=Array.from(document.querySelectorAll('.intro-slide'));
let introIndex=0;
// Classroom entry phrase; intentionally stored in this static HTML file.
const ENTRY_PASSWORD='67';
el('entry-form').addEventListener('submit',event=>{
  event.preventDefault();
  const input=el('entry-password');
  if(input.value.trim()!==ENTRY_PASSWORD){
    input.setAttribute('aria-invalid','true');
    el('entry-error').textContent='הסיסמה אינה נכונה. נסו שוב.';
    input.focus();
    return;
  }
  input.value='';
  input.removeAttribute('aria-invalid');
  el('entry-error').textContent='';
  el('entry-screen').hidden=true;
  el('intro').hidden=false;
  introSlides[0].querySelector('h1').focus({preventScroll:true});
  window.scrollTo(0,0);
});
el('entry-password').addEventListener('input',()=>{
  el('entry-password').removeAttribute('aria-invalid');
  el('entry-error').textContent='';
});
document.querySelectorAll('[data-intro-next]').forEach(button=>button.addEventListener('click',()=>{
  if(!el('entry-screen').hidden||el('intro').hidden||introIndex>=introSlides.length-1)return;
  introSlides[introIndex].hidden=true;
  introSlides[++introIndex].hidden=false;
  introSlides[introIndex].querySelector('h1').focus({preventScroll:true});
  window.scrollTo(0,0);
}));
el('start-game').addEventListener('click',()=>{
  if(!el('entry-screen').hidden||introIndex!==introSlides.length-1)return;
  el('intro').hidden=true;
  el('game-shell').hidden=false;
  loadLevel(0);
  setBoardFocus(focusIndex,true);
  window.scrollTo(0,0);
  announce('פאזל 1 נפתח. עזרו לבני ישראל לצאת מהים!');
});
readProgress();
