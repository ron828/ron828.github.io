function initialState(i){const terrain=LEVELS[i].map.map(r=>r.split(''));let player;const rocks=[],monsters=[];terrain.forEach((row,y)=>row.forEach((c,x)=>{if(c==='P'){player={x,y};terrain[y][x]=' ';}if(c==='B'){rocks.push({x,y});terrain[y][x]=' ';}if(c==='G'){monsters.push({x,y});terrain[y][x]=' ';}}));return {terrain,player,rocks,monsters,moves:0};}
const at=(items,x,y)=>items.findIndex(o=>o.x===x&&o.y===y);
const tile=(s,x,y)=>s.terrain[y]?.[x]??'#';
function settle(s){for(let n=0;n<140;n++){let changed=false;for(const r of [...s.rocks].sort((a,b)=>b.y-a.y)){if(tile(s,r.x,r.y+1)===' '&&at(s.rocks,r.x,r.y+1)<0&&at(s.monsters,r.x,r.y+1)<0&&!(s.player.x===r.x&&s.player.y===r.y+1)){r.y++;changed=true;}}
const p=s.player;if(tile(s,p.x,p.y)!=='H'&&tile(s,p.x,p.y+1)===' '&&at(s.rocks,p.x,p.y+1)<0&&at(s.monsters,p.x,p.y+1)<0){p.y++;changed=true;}if(!changed)break;}return s;}
function step(state,dir){if(!state.monsters.length)return null;const s=JSON.parse(JSON.stringify(state)),p=s.player;const [dx,dy]=({left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]})[dir]||[0,0];if(!dx&&!dy)return null;const x=p.x+dx,y=p.y+dy,t=tile(s,x,y);if(t==='#')return null;if(dy===-1&&tile(s,p.x,p.y)!=='H')return null;if(dy===1&&tile(s,p.x,p.y)!=='H'&&t!=='H'&&t!=='D')return null;const r=at(s.rocks,x,y),m=at(s.monsters,x,y);if(m>=0){if(!dx)return null;s.monsters.splice(m,1);p.x=x;}else if(r>=0){if(!dx||tile(s,x+dx,y)!==' '||at(s.rocks,x+dx,y)>=0||at(s.monsters,x+dx,y)>=0)return null;s.rocks[r].x+=dx;}else if(t==='D'){s.terrain[y][x]=' ';}else{p.x=x;p.y=y;}s.moves++;return settle(s);}

const sprites={cat:['1100000011','1110000111','1111111111','1111111111','1101101011','1101101011','1111001111','0111111110','0011111100','0110110110'],ghost:['0001111000','0011111100','0111111110','1111111111','1100110011','1100110011','1111111111','1111111111','1111111111','1101101101']};
function sprite(pattern,x,y,color,scale=2){ctx.fillStyle=color;pattern.forEach((row,j)=>[...row].forEach((c,i)=>{if(c==='1')ctx.fillRect(x+i*scale,y+j*scale,scale,scale);}));}
function draw(){ctx.fillStyle='#b9c797';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<state.terrain.length;y++)for(let x=0;x<state.terrain[y].length;x++){const px=x*32,py=y*32,t=tile(state,x,y);ctx.fillStyle='#b1c08e';ctx.fillRect(px+15,py+15,1,1);if(t==='#'){ctx.fillStyle='#566b42';ctx.fillRect(px,py,32,32);ctx.fillStyle='#6e8051';ctx.fillRect(px+1,py+1,30,2);ctx.fillStyle='#3d5434';ctx.fillRect(px,py+29,32,3);ctx.fillRect(px+15,py+2,2,13);ctx.fillRect(px,py+14,32,2);ctx.fillRect(px+5,py+16,2,13);}if(t==='H'){ctx.fillStyle='#50633a';ctx.fillRect(px+7,py,3,32);ctx.fillRect(px+22,py,3,32);for(let j=4;j<32;j+=8)ctx.fillRect(px+10,py+j,12,3);}if(t==='D'){ctx.fillStyle='#7f8b50';ctx.fillRect(px+1,py+1,30,30);ctx.fillStyle='#53643a';for(let j=4;j<30;j+=7)for(let i=4;i<30;i+=7)ctx.fillRect(px+i+(j%2)*2,py+j,3,2);}}
for(const r of state.rocks){const x=r.x*32,y=r.y*32;ctx.fillStyle='#344d32';ctx.fillRect(x+3,y+3,26,26);ctx.fillStyle='#899866';ctx.fillRect(x+5,y+5,22,20);ctx.fillStyle='#b7c18a';ctx.fillRect(x+6,y+5,18,3);ctx.fillRect(x+5,y+5,3,17);ctx.fillStyle='#64784c';ctx.fillRect(x+10,y+12,12,3);ctx.fillRect(x+18,y+15,4,7);}
for(const m of state.monsters){sprite(sprites.ghost,m.x*32+6,m.y*32+10,'#435b35');ctx.fillStyle='#dce4b3';ctx.fillRect(m.x*32+10,m.y*32+18,2,4);ctx.fillRect(m.x*32+18,m.y*32+18,2,4);}
sprite(sprites.cat,state.player.x*32+6,state.player.y*32+10,'#243f2c');ctx.fillStyle='#d9e5ac';ctx.fillRect(state.player.x*32+12,state.player.y*32+18,2,4);ctx.fillRect(state.player.x*32+20,state.player.y*32+18,2,4);

const total=initialState(current).monsters.length;
$('moves').textContent=String(state.moves).padStart(3,'0');
$('remaining').textContent=`${total-state.monsters.length} / ${total}`;
$('room').textContent=`${String(current+1).padStart(2,'0')} / ${LEVELS.length}`;
$('undo').disabled=!history.length;
const won=!state.monsters.length;$('overlay').hidden=!won;
if(won){const allDone=completed.size===LEVELS.length,last=current===LEVELS.length-1;
 $('win-title').textContent=allDone?'כל החידות הושלמו!':'השלב הושלם!';
 $('win-text').textContent=allDone?`איזה מסע! השלב הזה הושלם ב־${state.moves} צעדים. אפשר לחזור לכל שלב ולנסות מסלול קצר יותר.`:`אספתם את כל היצורים ב־${state.moves} צעדים. ${last?'אפשר לחזור לשלבים שטרם הושלמו.':'האתגר הבא כבר מחכה.'}`;
 $('next').textContent=last?(allDone?'בחזרה להתחלה ↻':'לשלב שטרם הושלם ←'):'לשלב הבא ←';
}}
function levelButtons(){
 $('levels').innerHTML='';$('chapter').value=String(chapter);$('progress').textContent=`הושלמו ${completed.size} מתוך ${LEVELS.length} שלבים`;
 LEVELS.slice(chapter*10,chapter*10+10).forEach((l,j)=>{const i=chapter*10+j,b=document.createElement('button');
  b.title=l.name;b.className='level'+(i===current?' active':'');b.setAttribute('aria-pressed',String(i===current));
  b.setAttribute('aria-label',`שלב ${i+1}: ${l.name}${completed.has(i)?', הושלם':''}`);
  b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><span><strong>${l.name}</strong><small>${l.sub}</small></span><span class="check" aria-hidden="true">${completed.has(i)?'✓':i===current?'←':''}</span>`;
  b.onclick=()=>loadLevel(i);$('levels').append(b);
 });
}
function loadLevel(i){
 if(!Number.isInteger(i)||i<0||i>=LEVELS.length)return;
 current=i;chapter=Math.floor(i/10);state=settle(initialState(i));history=[];
 canvas.width=state.terrain[0].length*32;canvas.height=state.terrain.length*32;ctx.imageSmoothingEnabled=false;
 $('hint').textContent=LEVELS[i].hint;$('hint').hidden=true;$('hint-toggle').textContent='הצגת רמז';$('hint-toggle').setAttribute('aria-expanded','false');
 $('status').textContent=`שלב ${i+1}: ${LEVELS[i].name}. אספו את כל היצורים.`;
 canvas.setAttribute('aria-label',`לוח שלב ${i+1}: ${LEVELS[i].name}. חצים לתנועה, Z לביטול צעד, R להתחלה מחדש.`);
 try{localStorage.setItem('catrap-handcrafted-v1-current',String(i));}catch{}
 levelButtons();draw();
 const active=$('levels').querySelector('.active');if(active)$('levels').scrollTop=active.offsetTop-$('levels').offsetTop;
}
function move(dir){
 const next=step(state,dir);
 if(!next){if(state.monsters.length)$('status').textContent='אין מעבר בכיוון הזה. נסו כיוון אחר.';return;}
 history.push(state);const found=next.monsters.length<state.monsters.length;state=next;
 $('status').textContent=found?'עוד יצור נאסף. מתקרבים לפתרון!':'קחו את הזמן. תמיד אפשר לחזור צעד לאחור.';
 if(!state.monsters.length){completed.add(current);try{localStorage.setItem('catrap-handcrafted-v1-completed',JSON.stringify([...completed]));}catch{}levelButtons();$('status').textContent='השלב הושלם!';}draw();
}
$('chapter').onchange=()=>{chapter=Number($('chapter').value);levelButtons();};
$('hint-toggle').onclick=()=>{const show=$('hint').hidden;$('hint').hidden=!show;$('hint-toggle').textContent=show?'הסתרת רמז':'הצגת רמז';$('hint-toggle').setAttribute('aria-expanded',String(show));};
$('undo').onclick=()=>{if(history.length){state=history.pop();$('status').textContent='חזרתם צעד לאחור. הזדמנות לנסות דרך אחרת.';draw();}};
$('restart').onclick=()=>loadLevel(current);
$('next').onclick=()=>loadLevel(current<LEVELS.length-1?current+1:(LEVELS.findIndex((_,i)=>!completed.has(i))<0?0:LEVELS.findIndex((_,i)=>!completed.has(i))));
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('select,input,textarea'))return;
 const dir={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
 if(dir){e.preventDefault();move(dir);}
 else if(e.code==='KeyZ'||e.key.toLowerCase()==='z'){e.preventDefault();$('undo').click();}
 else if((e.code==='KeyR'||e.key.toLowerCase()==='r')&&!e.repeat){e.preventDefault();loadLevel(current);}
});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>move(b.dataset.dir));loadLevel(current);
</script>
</body>
</html>
